<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6. 도감 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Gowun Dodum', sans-serif; }
    a { color: #e08a3c; }
    a:hover { color: #c98a46; }
  </style>
<style>
  html, body { background:#e9e2d3; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; margin:0; }
</style>
</head>
<body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#f6ede0;color:#1c2b2f;">

  <div style="padding:50px 24px 0;">
    <div style="font-family:'Gowun Batang',serif;font-size:24px;font-weight:700;">도감</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
      <div style="font-size:13px;color:#7c6a55;">12 / 30 마리 수집</div>
      <div style="font-size:13px;color:#1f5c62;font-weight:700;">40%</div>
    </div>
    <div style="margin-top:8px;height:7px;border-radius:4px;background:#e6d9c4;overflow:hidden;">
      <div style="width:40%;height:100%;background:linear-gradient(90deg,#2a7a80,#6fb3ad);"></div>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:20px 24px 0;overflow:hidden;">
    <div style="padding:8px 16px;border-radius:18px;background:#1f5c62;color:#fbf3e7;font-size:12.5px;font-weight:700;">전체</div>
    <div style="padding:8px 16px;border-radius:18px;background:#ffffff;color:#7c6a55;font-size:12.5px;">일반</div>
    <div style="padding:8px 16px;border-radius:18px;background:#ffffff;color:#7c6a55;font-size:12.5px;">희귀</div>
    <div style="padding:8px 16px;border-radius:18px;background:#ffffff;color:#7c6a55;font-size:12.5px;">전설</div>
  </div>

  <div style="padding:20px 20px 100px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;">

    <div style="background:#ffffff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#4f9aa0"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#4f9aa0"></path><circle cx="14" cy="14" r="2.6" fill="#0d2438"></circle></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;">붕어</div>
      <div style="font-size:10px;color:#8a7860;">22cm</div>
    </div>

    <div style="background:#ffffff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#e0a03c"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#e0a03c"></path><circle cx="14" cy="14" r="2.6" fill="#0d2438"></circle></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;">황금붕어</div>
      <div style="font-size:10px;color:#8a7860;">32cm</div>
    </div>

    <div style="background:#ece2d2;border-radius:16px;padding:14px 8px;text-align:center;">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#c9bda8"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#c9bda8"></path></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;color:#a99a83;">???</div>
      <div style="font-size:10px;color:#b3a692;">미포획</div>
    </div>

    <div style="background:#ffffff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#5c7bb5"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#5c7bb5"></path><circle cx="14" cy="14" r="2.6" fill="#0d2438"></circle></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;">피라미</div>
      <div style="font-size:10px;color:#8a7860;">14cm</div>
    </div>

    <div style="background:#ece2d2;border-radius:16px;padding:14px 8px;text-align:center;">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#c9bda8"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#c9bda8"></path></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;color:#a99a83;">???</div>
      <div style="font-size:10px;color:#b3a692;">미포획</div>
    </div>

    <div style="background:#ffffff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#8a5a2e"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#8a5a2e"></path><circle cx="14" cy="14" r="2.6" fill="#fbf3e7"></circle></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;">메기</div>
      <div style="font-size:10px;color:#8a7860;">48cm</div>
    </div>

    <div style="background:#ece2d2;border-radius:16px;padding:14px 8px;text-align:center;">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#c9bda8"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#c9bda8"></path></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;color:#a99a83;">???</div>
      <div style="font-size:10px;color:#b3a692;">미포획</div>
    </div>

    <div style="background:#ece2d2;border-radius:16px;padding:14px 8px;text-align:center;">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#c9bda8"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#c9bda8"></path></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;color:#a99a83;">???</div>
      <div style="font-size:10px;color:#b3a692;">미포획</div>
    </div>

    <div style="background:#ffffff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <svg width="52" height="29" viewBox="0 0 64 36" style="margin:0 auto;display:block;"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#2a7a80"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#2a7a80"></path><circle cx="14" cy="14" r="2.6" fill="#fbf3e7"></circle></svg>
      <div style="font-size:11.5px;font-weight:700;margin-top:8px;">잉어</div>
      <div style="font-size:10px;color:#8a7860;">55cm</div>
    </div>

  </div>

  <div style="position:absolute;left:0;bottom:0;width:390px;height:82px;background:linear-gradient(180deg,#b5793f,#8a5a2e);display:flex;align-items:center;justify-content:space-around;padding:0 10px 6px;box-shadow:0 -4px 14px rgba(0,0,0,0.25);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(251,243,231,0.55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"></circle><path d="M12 13v8"></path><path d="M9 21h6"></path></svg>
      <span style="font-size:11px;">시작</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#fbf3e7;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbf3e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-2Z"></path><path d="M17 3v18"></path></svg>
      <span style="font-size:11px;font-weight:700;">도감</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(251,243,231,0.55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-7"></path></svg>
      <span style="font-size:11px;">통계</span>
    </div>
  </div>

</div>
</body>
</html>
