<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5. 결과 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Gowun Dodum', sans-serif; }
    a { color: #e08a3c; }
    a:hover { color: #c98a46; }
  </style>
<style>
  html, body { background:#e9e2d3; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; margin:0; }
</style>
</head>
<body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(180deg,#123249 0%,#1f5c62 26%,#f6ede0 26%,#f6ede0 100%);color:#1c2b2f;">

  <div style="position:relative;padding:44px 24px 0;text-align:center;color:#fbf3e7;">
    <div style="font-size:13px;color:#cfe0dc;">낚시 성공!</div>
    <div style="font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;margin-top:4px;">오늘의 손맛</div>
  </div>

  <div style="position:relative;margin:26px 24px 0;background:#ffffff;border-radius:22px;box-shadow:0 14px 30px rgba(18,50,73,0.18);padding:28px 22px 22px;">
    <div style="position:absolute;top:-14px;right:22px;padding:6px 14px;border-radius:14px;background:linear-gradient(90deg,#e0c93c,#e08a3c);color:#3a2a10;font-size:12px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,0.2);">희귀 등급</div>

    <div style="display:flex;justify-content:center;padding:10px 0 6px;">
      <svg width="150" height="90" viewBox="0 0 150 90">
        <ellipse cx="60" cy="45" rx="52" ry="32" fill="#e0a03c"></ellipse>
        <path d="M108 45 L146 20 L146 70 Z" fill="#e0a03c"></path>
        <path d="M30 30 Q60 20 90 32" stroke="#c98a2e" stroke-width="3" fill="none" opacity="0.6"></path>
        <circle cx="30" cy="38" r="5" fill="#1c2b2f"></circle>
      </svg>
    </div>

    <div style="text-align:center;margin-top:8px;">
      <div style="font-family:'Gowun Batang',serif;font-size:24px;font-weight:700;">황금붕어</div>
      <div style="font-size:14px;color:#7c6a55;margin-top:4px;">32cm · 오후 3:14 포획</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;">
      <div style="flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:#f6ede0;">
        <div style="font-size:11.5px;color:#8a7860;">집중 시간</div>
        <div style="font-size:16px;font-weight:700;margin-top:4px;">25분</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:#f6ede0;">
        <div style="font-size:11.5px;color:#8a7860;">챔질 반응</div>
        <div style="font-size:16px;font-weight:700;margin-top:4px;">0.4초</div>
      </div>
      <div style="flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:#f6ede0;">
        <div style="font-size:11.5px;color:#8a7860;">누적 조과</div>
        <div style="font-size:16px;font-weight:700;margin-top:4px;">12마리</div>
      </div>
    </div>
  </div>

  <div style="position:relative;padding:26px 24px 0;">
    <button style="width:100%;padding:15px;border:none;border-radius:24px;background:linear-gradient(90deg,#c98a46,#a9713f);color:#fbf3e7;font-size:15.5px;font-weight:700;font-family:'Gowun Batang',serif;box-shadow:0 8px 18px rgba(138,90,46,0.35);">도감에 저장하기</button>
    <button style="width:100%;padding:14px;margin-top:12px;border-radius:24px;background:transparent;border:1.5px solid #1f5c62;color:#1f5c62;font-size:14.5px;font-weight:700;">다시 낚시하기</button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:12px;color:#8a7860;">이번 주 3번째 손맛이에요</div>

</div>
</body>
</html>
