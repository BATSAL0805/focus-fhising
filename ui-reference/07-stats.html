<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7. 통계 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Gowun Dodum', sans-serif; }
    a { color: #e08a3c; }
    a:hover { color: #c98a46; }
  </style>
<style>
  html, body { background:#e9e2d3; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; margin:0; }
</style>
</head>
<body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#f6ede0;color:#1c2b2f;">

  <div style="padding:50px 24px 0;">
    <div style="font-family:'Gowun Batang',serif;font-size:24px;font-weight:700;">통계</div>
    <div style="font-size:13px;color:#7c6a55;margin-top:4px;">꾸준한 손맛의 기록</div>
  </div>

  <div style="display:flex;gap:10px;padding:22px 24px 0;">
    <div style="flex:1;background:#ffffff;border-radius:16px;padding:16px 12px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <div style="font-size:11.5px;color:#8a7860;">총 집중 시간</div>
      <div style="font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;margin-top:6px;">14시간 20분</div>
    </div>
    <div style="flex:1;background:#ffffff;border-radius:16px;padding:16px 12px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <div style="font-size:11.5px;color:#8a7860;">총 조과</div>
      <div style="font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;margin-top:6px;">12마리</div>
    </div>
  </div>

  <div style="padding:14px 24px 0;">
    <div style="background:#1f5c62;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 18px rgba(31,92,98,0.25);">
      <div>
        <div style="font-size:11.5px;color:#bcd8d4;">연속 집중 기록</div>
        <div style="font-family:'Gowun Batang',serif;font-size:20px;font-weight:700;color:#fbf3e7;margin-top:4px;">6일 연속 출조</div>
      </div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e08a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4-2 5-2 9a4 4 0 0 0 8 0c0-2-1-3-1-3s1 4-2 4-3-3-1-6c-3 0-5 1-5 4a5 5 0 0 0 10 0C19 6 15 4 12 3Z"></path></svg>
    </div>
  </div>

  <div style="padding:26px 24px 0;">
    <div style="font-size:13.5px;font-weight:700;color:#4a3f30;">이번 주 집중 시간</div>
    <div style="margin-top:16px;background:#ffffff;border-radius:16px;padding:20px 16px 14px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
      <div style="display:flex;align-items:flex-end;gap:10px;height:120px;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:35%;border-radius:6px;background:#bcd8d4;"></div>
          <span style="font-size:10.5px;color:#8a7860;">월</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:60%;border-radius:6px;background:#6fb3ad;"></div>
          <span style="font-size:10.5px;color:#8a7860;">화</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:42%;border-radius:6px;background:#bcd8d4;"></div>
          <span style="font-size:10.5px;color:#8a7860;">수</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:85%;border-radius:6px;background:#2a7a80;"></div>
          <span style="font-size:10.5px;color:#8a7860;">목</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:50%;border-radius:6px;background:#6fb3ad;"></div>
          <span style="font-size:10.5px;color:#8a7860;">금</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:70%;border-radius:6px;background:#e08a3c;"></div>
          <span style="font-size:10.5px;color:#8a7860;">토</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;">
          <div style="width:100%;height:20%;border-radius:6px;background:#e6d9c4;"></div>
          <span style="font-size:10.5px;color:#8a7860;">일</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:22px 24px 0;">
    <div style="font-size:13.5px;font-weight:700;color:#4a3f30;">이번 주 조황</div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">

      <div style="display:flex;align-items:center;gap:12px;background:#ffffff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
        <svg width="40" height="23" viewBox="0 0 64 36"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#e0a03c"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#e0a03c"></path></svg>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">황금붕어</div>
          <div style="font-size:11px;color:#8a7860;">오늘 · 15:14</div>
        </div>
        <div style="font-size:12px;color:#7c6a55;">32cm</div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;background:#ffffff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
        <svg width="40" height="23" viewBox="0 0 64 36"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#5c7bb5"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#5c7bb5"></path></svg>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">피라미</div>
          <div style="font-size:11px;color:#8a7860;">어제 · 21:02</div>
        </div>
        <div style="font-size:12px;color:#7c6a55;">14cm</div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;background:#ffffff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 10px rgba(28,43,47,0.06);">
        <svg width="40" height="23" viewBox="0 0 64 36"><ellipse cx="26" cy="18" rx="22" ry="14" fill="#4f9aa0"></ellipse><path d="M46 18 L64 6 L64 30 Z" fill="#4f9aa0"></path></svg>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">붕어</div>
          <div style="font-size:11px;color:#8a7860;">3일 전 · 09:40</div>
        </div>
        <div style="font-size:12px;color:#7c6a55;">22cm</div>
      </div>

    </div>
  </div>

  <div style="height:100px;"></div>

  <div style="position:absolute;left:0;bottom:0;width:390px;height:82px;background:linear-gradient(180deg,#b5793f,#8a5a2e);display:flex;align-items:center;justify-content:space-around;padding:0 10px 6px;box-shadow:0 -4px 14px rgba(0,0,0,0.25);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(251,243,231,0.55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"></circle><path d="M12 13v8"></path><path d="M9 21h6"></path></svg>
      <span style="font-size:11px;">시작</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(251,243,231,0.55);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-2Z"></path><path d="M17 3v18"></path></svg>
      <span style="font-size:11px;">도감</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#fbf3e7;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbf3e7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-7"></path></svg>
      <span style="font-size:11px;font-weight:700;">통계</span>
    </div>
  </div>

</div>
</body>
</html>
