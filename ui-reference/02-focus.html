<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2. 집중 대기 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Gowun Dodum', sans-serif; }
    a { color: #e08a3c; }
    a:hover { color: #c98a46; }
    @keyframes bob { 0%,100% { transform: translate(-50%,-50%) translateY(0); } 50% { transform: translate(-50%,-50%) translateY(-7px); } }
    @keyframes ripple { 0% { transform: translate(-50%,-50%) scale(0.6); opacity: 0.5; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
  </style>
<style>
  html, body { background:#e9e2d3; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; margin:0; }
</style>
</head>
<body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0a1c2c 0%,#0f2b3d 22%,#164457 48%,#1f5c62 100%);color:#fbf3e7;">

  <div style="position:absolute;top:60px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(230,201,150,0.28),rgba(230,201,150,0) 70%);"></div>

  <svg width="390" height="360" viewBox="0 0 390 360" style="position:absolute;left:0;bottom:0;">
    <path d="M0,120 C60,80 130,150 195,115 C260,80 330,150 390,110 L390,360 L0,360 Z" fill="#20565d" opacity="0.5"></path>
    <path d="M0,160 C70,120 140,190 195,160 C250,130 320,190 390,155 L390,360 L0,360 Z" fill="#184a50" opacity="0.75"></path>
    <path d="M0,200 C80,175 150,220 195,200 C260,180 330,225 390,195 L390,360 L0,360 Z" fill="#123a40" opacity="0.9"></path>
  </svg>

  <div style="position:relative;padding:50px 24px 0;display:flex;justify-content:center;">
    <div style="padding:8px 18px;border-radius:20px;background:rgba(255,255,255,0.1);font-size:12.5px;color:#d7e8e5;">25분 집중 · 3회차</div>
  </div>

  <div style="position:relative;margin-top:26px;text-align:center;font-size:13px;color:#9ec2bd;">찌를 지켜보는 중...</div>

  <div style="position:absolute;left:50%;top:300px;transform:translateX(-50%);width:120px;height:120px;">
    <div style="position:absolute;left:50%;top:70%;width:60px;height:22px;border-radius:50%;border:2px solid rgba(207,232,226,0.35);transform:translate(-50%,-50%);animation:ripple 2.6s ease-out infinite;"></div>
    <div style="position:absolute;left:50%;top:70%;width:60px;height:22px;border-radius:50%;border:2px solid rgba(207,232,226,0.35);transform:translate(-50%,-50%);animation:ripple 2.6s ease-out infinite 1.3s;"></div>
    <div style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);animation:bob 3s ease-in-out infinite;">
      <svg width="30" height="68" viewBox="0 0 30 68">
        <line x1="15" y1="0" x2="15" y2="24" stroke="#e08a3c" stroke-width="3" stroke-linecap="round"></line>
        <path d="M15 22 C24 26 24 42 15 48 C6 42 6 26 15 22 Z" fill="#fdf6ec" stroke="#8a5a2e" stroke-width="1.5"></path>
      </svg>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:470px;text-align:center;">
    <div style="font-family:'Gowun Batang',serif;font-size:64px;font-weight:700;letter-spacing:1px;">18:24</div>
    <div style="margin-top:14px;width:200px;height:5px;border-radius:3px;background:rgba(255,255,255,0.15);margin-left:auto;margin-right:auto;overflow:hidden;">
      <div style="width:68%;height:100%;background:#e08a3c;border-radius:3px;"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:64px;display:flex;justify-content:center;gap:22px;">
    <button style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fbf3e7"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>
    </button>
    <button style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fbf3e7"><rect x="4" y="4" width="16" height="16" rx="2.5"></rect></svg>
    </button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:11.5px;color:#7fa39d;">화면을 벗어나면 찌를 놓칠 수 있어요</div>

</div>
</body>
</html>
